<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blockchain Transparency</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h1 class="text-center">Blockchain Transparency Demo</h1>

    <div class="text-center mt-4">
        <button class="btn btn-success" onclick="loadBlockchain()">View Blockchain Log</button>
        <div id="blockchain" class="mt-3"></div>
    </div>

    <script>
        async function loadBlockchain() {
            const res = await fetch("/blockchain");
            const data = await res.json();
            let html = "<table class='table table-bordered w-75 mx-auto'>";
            html += "<thead><tr><th>Block</th><th>Timestamp</th><th>Scholarship</th><th>Status</th><th>Hash</th></tr></thead><tbody>";
            data.forEach(block => {
                html += `<tr>
                            <td>${block.block}</td>
                            <td>${block.timestamp}</td>
                            <td>${block.scholarship}</td>
                            <td>${block.status}</td>
                            <td>${block.hash}</td>
                         </tr>`;
            });
            html += "</tbody></table>";
            document.getElementById("blockchain").innerHTML = html;
        }
    </script>
</body>
</html>
