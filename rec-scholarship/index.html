<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scholarship Recommendation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h1 class="text-center">Scholarship Recommendation</h1>

    <div class="text-center">
        <label>Marks:</label>
        <input type="number" id="marks" value="85" class="form-control w-25 mx-auto"><br>
        <label>Income:</label>
        <input type="text" id="income" value="low" class="form-control w-25 mx-auto"><br>
        <button class="btn btn-primary" onclick="getRecommendation()">Get Scholarships</button>
        <div id="recommendation" class="mt-3"></div>
    </div>

    <script>
        async function getRecommendation() {
            const marks = document.getElementById("marks").value;
            const income = document.getElementById("income").value;
            const res = await fetch("/recommend", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({marks: parseInt(marks), income: income})
            });
            const data = await res.json();
            let html = "";
            data.forEach(s => {
                html += `<div class="card p-2 m-2">
                            <h5>${s.name}</h5>
                            <p>Amount: ${s.amount}</p>
                            <p>Success Probability: ${s.probability}%</p>
                         </div>`;
            });
            document.getElementById("recommendation").innerHTML = html;
        }
    </script>
</body>
</html>
