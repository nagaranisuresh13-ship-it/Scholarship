<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Personalized Scholarship Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h1 class="text-center">Personalized Scholarship Results</h1>

    <div class="text-center">
        <label>Marks:</label>
        <input type="number" id="marks" value="85" class="form-control w-25 mx-auto"><br>
        <label>Category:</label>
        <input type="text" id="category" value="SC/ST" class="form-control w-25 mx-auto"><br>
        <label>Interests:</label>
        <input type="text" id="interests" value="sports" class="form-control w-25 mx-auto"><br>
        <button class="btn btn-primary" onclick="getPersonalized()">Get Personalized Scholarships</button>
        <div id="results" class="mt-3"></div>
    </div>

    <script>
        async function getPersonalized() {
            const marks = document.getElementById("marks").value;
            const category = document.getElementById("category").value;
            const interests = document.getElementById("interests").value;

            const res = await fetch("/personalized", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({marks: parseInt(marks), category: category, interests: interests})
            });

            const data = await res.json();
            let html = "<div class='list-group w-75 mx-auto'>";
            data.forEach(s => {
                html += `<div class="list-group-item">
                            <h5>${s.name}</h5>
                            <p>Reason: ${s.reason}</p>
                         </div>`;
            });
            html += "</div>";
            document.getElementById("results").innerHTML = html;
        }
    </script>
</body>
</html>
