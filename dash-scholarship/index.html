<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Unified Dashboard & Tracking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h1 class="text-center">Unified Scholarship Dashboard</h1>

    <div class="text-center mt-4">
        <button class="btn btn-primary" onclick="loadDashboard()">View My Applications</button>
        <div id="dashboard" class="mt-3"></div>
    </div>

    <script>
        async function loadDashboard() {
            const res = await fetch("/dashboard");
            const data = await res.json();
            let html = "<table class='table table-bordered w-75 mx-auto'>";
            html += "<thead><tr><th>Scholarship</th><th>Status</th><th>Deadline</th></tr></thead><tbody>";
            data.forEach(app => {
                html += `<tr>
                            <td>${app.name}</td>
                            <td>${app.status}</td>
                            <td>${app.deadline}</td>
                         </tr>`;
            });
            html += "</tbody></table>";
            document.getElementById("dashboard").innerHTML = html;
        }
    </script>
</body>
</html>
