<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #222;
      color: white;
      font-family: 'Segoe UI', sans-serif;
    }
    .container {
      margin-top: 80px;
      background: rgba(0,0,0,0.6);
      padding: 30px;
      border-radius: 15px;
    }
    .title {
      font-size: 2rem;
      font-weight: bold;
      color: #FFD700;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="container text-center">
    <div id="pageTitle" class="title">Welcome to Innovatable Portal</div>

    <!-- Language Selection -->
    <select id="languageSelect" class="form-select w-50 mx-auto mb-3" onchange="applyLanguage()">
      <option value="en">English</option>
      <option value="hi">Hindi</option>
      <option value="ta">Tamil</option>
      <option value="te">Telugu</option>
      <option value="kn">Kannada</option>
      <option value="ml">Malayalam</option>
      <option value="mr">Marathi</option>
      <option value="gu">Gujarati</option>
      <option value="pa">Punjabi</option>
      <option value="bn">Bengali</option>
      <option value="ur">Urdu</option>
      <option value="or">Odia</option>
      <option value="as">Assamese</option>
      <option value="ne">Nepali</option>
      <!-- Add other languages here -->
    </select>

    <!-- Create Account -->
    <h4 id="createLabel">Create Account</h4>
    <input type="text" id="username" class="form-control w-50 mx-auto" placeholder="Enter Username">
    <input type="password" id="pin" class="form-control w-50 mx-auto mt-2" placeholder="Set PIN">
    <button id="createBtn" class="btn btn-success mt-3" onclick="createAccount()">Create</button>

    <!-- Login -->
    <h4 id="loginLabel" class="mt-4">Login</h4>
    <input type="text" id="loginUser" class="form-control w-50 mx-auto" placeholder="Username">
    <input type="password" id="loginPin" class="form-control w-50 mx-auto mt-2" placeholder="PIN">
    <button id="loginBtn" class="btn btn-primary mt-3" onclick="login()">Login</button>
  </div>

      sd: {title:"Innovatable پورٽل ۾ ڀليڪار",createLabel:"اکائونٽ ٺاهيو",username:"استعمال ڪندڙ نالو",pin:"پن سيٽ ڪريو",createBtn:"ٺاهيو",loginLabel:"لاگ ان",loginUser:"استعمال ڪندڙ نالو",loginPin:"پن",loginBtn:"لاگ ان"},// Add other languages here...

    function applyLanguage() {
      let lang = document.getElementById("languageSelect").value;
      let t = translations[lang] || translations["en"];

      document.getElementById("pageTitle").innerText = t.title;
      document.getElementById("createLabel").innerText = t.createLabel;
      document.getElementById("username").placeholder = t.username;
      document.getElementById("pin").placeholder = t.pin;
      document.getElementById("createBtn").innerText = t.createBtn;
      document.getElementById("loginLabel").innerText = t.loginLabel;
      document.getElementById("loginUser").placeholder = t.loginUser;
      document.getElementById("loginPin").placeholder = t.loginPin;
      document.getElementById("loginBtn").innerText = t.loginBtn;
    }

      alert("Account creation logic here");
    }

      alert("Login logic here");
    }

</html>
