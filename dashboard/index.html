<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Application Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h1 class="text-center">Application Assistant</h1>

    <div class="text-center mt-5">
        <button class="btn btn-warning" onclick="getAssistant()">Show Steps</button>
        <div id="assistant" class="mt-3"></div>
    </div>

    <script>
        async function getAssistant() {
            const res = await fetch("/assistant");
            const data = await res.json();
            let html = "<div class='list-group w-75 mx-auto'>";
            data.forEach(step => {
                html += `<div class="list-group-item">
                            <h5>Step ${step.step}: ${step.title}</h5>
                            <p>${step.details}</p>
                         </div>`;
            });
            html += "</div>";
            document.getElementById("assistant").innerHTML = html;
        }
    </script>
</body>
</html>
